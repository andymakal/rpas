name: Migration Replay (temporary)

# Temporary branch-only workflow to verify the committed migration chain
# replays cleanly from an empty database. Runs ONLY on fix/migration-replay-ordering.
# Does not touch main or production. Remove after verification.

on:
  push:
    branches:
      - fix/migration-replay-ordering

jobs:
  replay:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: supabase/postgres:15.8.1.060
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" >/dev/null 2>&1; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "waiting for postgres ($i)..."
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Bootstrap Supabase prerequisites
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create extension if not exists "uuid-ossp";

          do $$
          begin
            if not exists (select from pg_roles where rolname = 'anon') then create role anon nologin noinherit; end if;
            if not exists (select from pg_roles where rolname = 'authenticated') then create role authenticated nologin noinherit; end if;
            if not exists (select from pg_roles where rolname = 'service_role') then create role service_role nologin noinherit bypassrls; end if;
            if not exists (select from pg_roles where rolname = 'supabase_auth_admin') then create role supabase_auth_admin nologin noinherit; end if;
            if not exists (select from pg_roles where rolname = 'authenticator') then create role authenticator noinherit login password 'postgres'; end if;
          end
          $$;

          grant anon, authenticated, service_role to authenticator;

          create schema if not exists auth authorization supabase_auth_admin;

          create table if not exists auth.users (
            id uuid primary key default gen_random_uuid(),
            email text
          );

          create or replace function auth.jwt() returns jsonb
            language sql stable as $$ select coalesce(nullif(current_setting('request.jwt.claims', true), '')::jsonb, '{}'::jsonb) $$;

          create or replace function auth.uid() returns uuid
            language sql stable as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;

          create or replace function auth.role() returns text
            language sql stable as $$ select nullif(current_setting('request.jwt.claim.role', true), '') $$;
          SQL
          echo "Bootstrap complete"

      - name: Apply migrations in filename order (ON_ERROR_STOP)
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=$(ls -1 supabase/migrations/*.sql | sort)
          if [ -z "$files" ]; then
            echo "No migration files found under supabase/migrations/" >&2
            exit 1
          fi
          echo "Found $(echo "$files" | wc -l) migration files."
          for f in $files; do
            echo "::group::Applying $f"
            err=$(psql -v ON_ERROR_STOP=1 -f "$f" 2>&1 >/dev/null) || {
              echo "::endgroup::"
              echo "=============================================================="
              echo "MIGRATION REPLAY FAILED"
              echo "First failing migration: $f"
              echo "--------------------------------------------------------------"
              echo "$err"
              echo "=============================================================="
              exit 1
            }
            echo "::endgroup::"
            echo "OK: $f"
          done
          echo "=============================================================="
          echo "MIGRATION REPLAY SUCCEEDED — all files applied cleanly."
          echo "=============================================================="
